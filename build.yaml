---
include:
  - board: seeeduino_xiao_ble
    shield: skreecustom_left nice_view_adapter nice_epaper
  - board: seeeduino_xiao_ble
    shield: skreecustom_right nice_view_adapter nice_epaper
  - board: seeeduino_xiao_ble
    shield: settings_reset
  # --- Left-half delay test builds (temporary; delete after testing) ---
  # E: stock nice!view display and no power management (sleep + soft-off off)
  - board: seeeduino_xiao_ble
    shield: skreecustom_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_PM_SOFT_OFF=n
    artifact-name: TEST-E_left_stock_no_pm
  # G: like E, plus default idle timeout, screen blanking and display thread priority
  #    (only differences left vs the working Nov 13 build: keymap layer names)
  - board: seeeduino_xiao_ble
    shield: skreecustom_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_PM_SOFT_OFF=n -DCONFIG_ZMK_IDLE_TIMEOUT=30000 -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5
    artifact-name: TEST-G_left_like_nov13
