CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# nice!view (peripheral): battery + connection status, catbus animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CATBUS=y
# Catbus frames are 124 px wide: fill the space below the status (the default 36 covered it)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=0
# Full loop length in ms for the 3 frames (1500 = 500 ms per frame; the GIF is 450).
# Higher = slower and less display work on this half.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1500
