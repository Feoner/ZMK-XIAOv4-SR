CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# nice!view (peripheral): battery + connection status, animated catbus below it
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CATBUS=y
# Speed: full loop length in ms for the 3 frames. 1500 = 500 ms per frame.
# Lower = faster (the original GIF is 450), higher = slower.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1500

# Still catbus instead of the animation: replace the four settings above with
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_CATBUS=y

# Catbus image is 124 px wide: fill the space below the status (the default 36 covered it)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=0
