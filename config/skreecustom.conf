# Pointing / Mouse — must be enabled for pointing.h and mkp to work
# CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Set NFC Pins on Xiao as GPIO - Do this only once then comment out
# CONFIG_NFCT_PINS_AS_GPIOS=y

# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Polyimide ghosting fix
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=0
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=1

# SPI and Input for trackball
CONFIG_SPI=y
CONFIG_INPUT=y

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sleep / power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y
# Idle after 15 min (dims RGB/display)
CONFIG_ZMK_IDLE_TIMEOUT=900000
# Deep sleep after 60 min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# nice!view displays (vendored zmk-nice-oled, shield "nice_epaper" in build.yaml)
# Keep the screens on when idle so the catbus sleep art can show
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y
CONFIG_NICE_OLED_SLEEP_ART_CATBUS=y

# Lag fix (both halves): the display thread defaulted to priority 5, the same as the threads
# that send key/mouse reports (ZMK_BLE_THREAD_PRIORITY on the right, which talks to the
# computer; ZMK_SPLIT_BLE_PERIPHERAL_PRIORITY on the left). Equal priorities can't interrupt
# each other, so reports waited for screen redraws. Higher number = lower priority.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
